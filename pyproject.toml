[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-shot-llm-confidence"
version = "0.1.0"
description = "Zero-shot confidence estimation for small LLMs — experiment code for the paper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "openai>=1.0",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "requests>=2.28",
    "datasets>=2.18",
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
bedrock = [
    "boto3>=1.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["autodidact*", "benchmarks*"]
